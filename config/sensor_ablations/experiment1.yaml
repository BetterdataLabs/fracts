__base__: config/default.yaml
test_size: 0
general:
  transformer:
    max_order: 0
  sequential:
    seq_len_list: [160000, 8000, 400, 20, 1]
    embed_dim_list: [512, 512, 512, 512, 512]
    num_blocks_list: [4, 4, 4, 4, 4]
    num_heads_list: [4, 4, 4, 4, 4]
    context_list:
      - []
      - []
      - []
      - []
      - []
    max_batch_size: 65535
    grad_checkpointing: true #to save memory during training but increases training time
    use_global_cond: true
    transformer_model: "llama"
  static:
    model_type: ctgan
train:
  sequential:
    epochs: 400
    warmup_epochs: 20
    num_workers: 8
    batch_size: 800
    lr: 5.e-4
    min_lr: 0.0
    grad_clip: 0.5
    weight_decay: 0.0001
    chunk_size: 1000
    save_epoch: 200
generate:
  sequential:
    num_workers: 8
    batch_size: 2048
    temperature: 0.01
    len_temperature: 0.01