__base__: config/default.yaml
test_size: 0
general:
  sequential:
    seq_len_list: [160000, 8000, 400, 20, 1]
    embed_dim_list: [512, 512, 512, 512, 512]
    num_blocks_list: [8, 8, 8, 8, 8]
    num_heads_list: [8, 8, 8, 8, 8]
    context_list:
      - []
      - []
      - []
      - []
      - []
    max_batch_size: 65535
    grad_checkpointing: true #to save memory during training but increases training time
    use_global_cond: true
    transformer_model: "llama"
  static:
    model_type: ctgan
train:
  sequential:
    epochs: 1000
    warmup_epochs: 20
    num_workers: 8
    batch_size: 8
    lr: 5.e-4
    min_lr: 0.0
    grad_clip: 0.1
    weight_decay: 0.0001
    chunk_size: 1000
generate:
  sequential:
    num_workers: 8
    batch_size: 256
    temperature: 0.01
    len_temperature: 0.01