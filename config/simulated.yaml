__base__: config/default.yaml
test_size: 0
general:
  transformer:
    agg_length: True
    n_bins: -1
    n_first: 0
    n_last: 0
    n_top: 0
    n_top_prop: 0
    max_order: 0
    max_agg_order: 0
    agg_functions: []
  sequential:
    seq_len_list: [160000, 8000, 400, 20, 1]
    embed_dim_list: [256, 256, 256, 256, 256]
    num_blocks_list: [4, 4, 4, 4, 4]
    num_heads_list: [4, 4, 4, 4, 4]
    context_list:
      - []
      - []
      - []
      - []
      - []
    max_batch_size: 65535
    grad_checkpointing: true #to save memory during training but increases training time
    use_global_cond: true
    transformer_model: "llama"
  static:
    model_type: rtf-r
    batch_size: 1024
train:
  sequential:
    epochs: 400
    warmup_epochs: 20
    num_workers: 8
    batch_size: 40
    lr: 5.e-4
    min_lr: 0.0
    grad_clip: 3.0
    weight_decay: 0.01
    chunk_size: 1000
generate:
  sequential:
    num_workers: 8
    batch_size: 256
    temperature: 0.01
    len_temperature: 0.01
    use_stop_token: false